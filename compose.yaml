
services:

  vertx-mongo-persistor:
    image: opendigitaleducation/vertx-service-launcher:3.0-SNAPSHOT
    user: "$DEFAULT_DOCKER_USER"
    environment:
      - MODE=cluster
      - ENABLED_SERVICES=io.vertx~mod-mongo-persistor
    volumes:
      - ./assets:/srv/springboard/assets
      - ./mods:/srv/springboard/mods
      - ./ent-core.json:/srv/springboard/conf/vertx.conf
      - ./aaf-duplicates-test:/home/wse/aaf
      - ~/.m2:/home/vertx/.m2
      - ./cluster-config/zookeeper.json:/srv/springboard/conf/zookeeper.json
    depends_on:
      - neo4j
      - postgres
      - mongo
      - redis
      - zookeeper1
      - zookeeper2
      - zookeeper3


